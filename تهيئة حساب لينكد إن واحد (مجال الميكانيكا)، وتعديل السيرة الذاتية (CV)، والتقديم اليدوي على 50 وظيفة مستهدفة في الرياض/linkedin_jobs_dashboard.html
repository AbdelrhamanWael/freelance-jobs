        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            text-align: center;
            min-width: 150px;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .search-box {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .job-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid #e9ecef;
        }

        .job-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-color: #667eea;
        }

        .job-title {
            color: #333;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .job-company {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .job-location {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .job-posted {
            color: #999;
            font-size: 0.85em;
            margin-bottom: 15px;
        }

        .job-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            transition: transform 0.3s;
        }

        .job-link:hover {
            transform: scale(1.05);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .badge-maintenance {
            background: #e3f2fd;
            color: #1976d2;
        }

        .badge-engineer {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .badge-technician {
            background: #fff3e0;
            color: #e65100;
        }

        .badge-aviation {
            background: #e8f5e9;
            color: #388e3c;
        }

        .badge-ev {
            background: #fce4ec;
            color: #c2185b;
        }

        .badge-hvac {
            background: #e0f2f1;
            color: #00695c;
        }

        @media (max-width: 768px) {
            .jobs-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .stats {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

        const jobsGrid = document.getElementById('jobsGrid');
        const searchInput = document.getElementById('searchInput');
        const filterButtons = document.querySelectorAll('.filter-btn');
        let currentFilter = 'all';

        function renderJobs(jobsToRender) {
            jobsGrid.innerHTML = '';
            jobsToRender.forEach(job => {
                const card = document.createElement('div');
                card.className = 'job-card';
                card.innerHTML = `
                    <span class="badge badge-${job.category}">${getCategoryLabel(job.category)}</span>
                    <div class="job-title">${job.title}</div>
                    <div class="job-company">${job.company}</div>
                    <div class="job-location">📍 ${job.location}</div>
                    <div class="job-posted">🕒 ${job.posted}</div>
                    <a href="${job.url}" target="_blank" class="job-link">عرض الوظيفة ↗</a>
                `;
                jobsGrid.appendChild(card);
            });
        }

        function getCategoryLabel(category) {
            const labels = {
                'maintenance': 'الصيانة',
                'engineer': 'مهندس',
                'technician': 'فني',
                'aviation': 'الطيران',
                'ev': 'مركبات كهربائية',
                'hvac': 'HVAC'
            };
            return labels[category] || category;
        }

        function filterJobs() {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredJobs = jobs.filter(job => {
                const matchesSearch = job.title.toLowerCase().includes(searchTerm) ||
                                     job.company.toLowerCase().includes(searchTerm) ||
                                     job.location.toLowerCase().includes(searchTerm);
                const matchesFilter = currentFilter === 'all' || job.category === currentFilter;
                return matchesSearch && matchesFilter;
            });
            renderJobs(filteredJobs);
        }

        searchInput.addEventListener('input', filterJobs);

        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                filterJobs();
            });
        });

        // Initial render
        renderJobs(jobs);
    </script>
