            ` : `
            <div class="field highlight-green full-width">
              <span class="field-tag">هل يحتوي على سوائل؟ (* Contains Liquid Contents?)</span>
              <div class="field-row">
                <span class="field-val" style="color:#34d399; font-weight:bold; font-size:13px;">
                  🔘 اختر <strong>No</strong> (لا) — بمجرد اختيار No ستختفي كافة حقول السوائل تلقائياً!
                </span>
                <button class="copy-btn" onclick="copyDirect(this, 'No')">نسخ (No)</button>
              </div>
            </div>
            `}

            <div class="field">
              <span class="field-tag">بلد المنشأ (Country of Origin)</span>
              <div class="field-row">
                <span class="field-val">Saudi Arabia</span>
                <button class="copy-btn" onclick="copyDirect(this, 'Saudi Arabia')">نسخ</button>
              </div>
            </div>
          </div>

          <!-- التبويب 2: Description & Bullets -->
          <div class="section-tag">📝 التبويب 2: الوصف والنقاط البارزة (Description)</div>
          <div class="grid">
            <div class="field full-width">
              <span class="field-tag">الوصف التسويقي (Product Description)</span>
              <div class="field-row">
                <span class="field-val desc-text">${p.desc}</span>
                <button class="copy-btn" onclick="copyField(this, ${p.id-1}, 'desc')">نسخ</button>
              </div>
            </div>
            
            <div class="field">
              <span class="field-tag">النقطة البارزة 1 (Bullet Point 1)</span>
              <div class="field-row">
                <span class="field-val" style="font-size:12px;">${p.b1}</span>
                <button class="copy-btn" onclick="copyField(this, ${p.id-1}, 'b1')">نسخ</button>
              </div>
            </div>
            
            <div class="field">
              <span class="field-tag">النقطة البارزة 2 (Bullet Point 2)</span>
              <div class="field-row">
                <span class="field-val" style="font-size:12px;">${p.b2}</span>
                <button class="copy-btn" onclick="copyField(this, ${p.id-1}, 'b2')">نسخ</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  `).join('');
}

function copyField(btn, idx, key) {
  const text = String(DATA[idx][key] || '');
  copyDirect(btn, text);
}

function copyDirect(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    const old = btn.innerText;
    btn.innerText = '✓ تم!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerText = old;
      btn.classList.remove('copied');
    }, 1200);
  });
}

function doSearch() {
  const query = document.getElementById('searchBox').value.toLowerCase().trim();
  if (!query) {
    renderList(DATA);
    return;
  }
  const filtered = DATA.filter(p => {
    return p.sku.toLowerCase().includes(query) || 
           p.barcode.toLowerCase().includes(query) || 
           p.name.toLowerCase().includes(query);
  });
  renderList(filtered);
}

// Initial render
renderList(DATA);
</script>
</body>
</html>
